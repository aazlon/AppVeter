services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-appveter}
      MARIADB_USER: ${DB_USER:-appveter}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es requerido (define .env o variables de entorno)}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD es requerido}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-appveter}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es requerido}
      DB_NAME: ${DB_NAME:-appveter}
      PORT: 3000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      NODE_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/public/uploads

volumes:
  db_data:
  uploads:
