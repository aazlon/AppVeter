<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' data: https://cdnjs.cloudflare.com; img-src 'self' data: blob: http://localhost:3000 http://127.0.0.1:3000; connect-src 'self' http://localhost:3000 http://127.0.0.1:3000 ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Veterinario | Pets Products 2022 C.A</title>

    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/RegisterRecep.css">
    <link rel="stylesheet" href="../css/NotificationModal.css">
    <link rel="stylesheet" href="../css/SuccessModal.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>

    <div id="navbar-root"></div>

    <main class="register-recep-main">
        <div class="register-recep-container">
            <div class="register-recep-left">
                <div class="register-recep-hero">
                    <h2>Registrar Veterinario</h2>
                    <p>Crea una cuenta de veterinario para que pueda gestionar historias clínicas, citas y clientes en la clínica.</p>
                </div>
            </div>

            <div class="register-recep-right">
                <form id="registerVeterForm" class="register-recep-form">
                    <h2 class="form-title">Nuevo Veterinario</h2>

                    <div class="image-upload-container">
                        <label for="imageInput" class="image-upload-label">
                            <img id="imagePreview" src="../../src/assets/cliente.jpg" alt="Vista previa de perfil"
                                class="profile-preview">
                            <div class="image-overlay">
                                <i class="fas fa-camera"></i>
                                <span>Subir foto</span>
                            </div>
                        </label>
                        <input type="file" id="imageInput" name="image" accept="image/*" hidden>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <i class="fas fa-user input-icon"></i>
                            <input type="text" id="name" name="name" placeholder="Nombre" required>
                        </div>
                        <div class="form-group">
                            <i class="fas fa-user-tag input-icon"></i>
                            <input type="text" id="lastname" name="lastname" placeholder="Apellido" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <i class="fas fa-user-circle input-icon"></i>
                        <input type="text" id="username" name="username" placeholder="Usuario" required>
                        <span class="field-error" data-field="username"></span>
                    </div>

                    <div class="form-group">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" name="email" placeholder="Correo electrónico" required>
                        <span class="field-error" data-field="email"></span>
                    </div>

                    <div class="form-group">
                        <i class="fas fa-id-card input-icon"></i>
                        <input type="text" id="cedula" name="cedula" placeholder="Cédula" required>
                        <span class="field-error" data-field="cedula"></span>
                    </div>

                    <div class="form-group">
                        <i class="fas fa-phone input-icon"></i>
                        <input type="tel" id="phone" name="phone" placeholder="Teléfono" required>
                        <span class="field-error" data-field="phone"></span>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="password" name="password" placeholder="Contraseña" required>
                        </div>
                        <div class="form-group">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="confirmpassword" name="confirmpassword" autocomplete="new-password"
                                placeholder="Confirmar Contraseña" required>
                        </div>
                    </div>

                    <div id="errorMessage" class="error-message"></div>

                    <button type="submit" id="btnSubmit" class="btn-submit">
                        <span class="btn-text">Registrar Veterinario</span>
                        <div class="loader" id="submitLoader"></div>
                    </button>
                </form>
            </div>
        </div>
    </main>

  
    <div id="footer-root"></div>

    <div class="success-modal" id="successModal">
        <div class="success-modal-content">
            <div class="success-icon-wrapper">
                <i class="fas fa-check"></i>
            </div>
            <p class="success-modal-message" id="successModalMessage">El registro se ha realizado correctamente</p>
        </div>
    </div>

    <script src="../js/RegisterVeter.js" type="module"></script>
</body>

</html>
