<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' data: https://cdnjs.cloudflare.com; img-src 'self' data: blob: http://localhost:3000 http://127.0.0.1:3000; connect-src 'self' http://localhost:3000 http://127.0.0.1:3000 ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios Veterinarios | Pets Products 2022 C.A</title>

    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/DeleteRecep.css">
    <link rel="stylesheet" href="../css/NotificationModal.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>

    <div id="navbar-root"></div>

    <main class="main-container">
        <header class="module-header">
            <span class="module-tag">Administración / Usuarios</span>
            <h1 class="module-title">Usuarios Veterinarios</h1>
            <p class="module-subtitle">Gestiona los usuarios con rol de veterinario registrados en la aplicación.</p>
        </header>

        <div class="records-section">
            <div class="section-header">
                <h2 class="section-title">Lista de Veterinarios</h2>
                <span class="records-count" id="records-count">0 registros</span>
            </div>

            <div class="table-container">
                <table class="records-table">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Usuario</th>
                            <th>Correo</th>
                            <th>Teléfono</th>
                            <th class="actions-col">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="veterinarians-tbody">
                        <tr>
                            <td colspan="6" class="loading-td">
                                <span class="spinner"></span>
                                Cargando veterinarios...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>


    <div id="footer-root"></div>

    <script src="../js/DeleteVeter.js" type="module"></script>
</body>

</html>
